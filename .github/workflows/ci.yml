name: Research-code checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q api_pilot dataset survey_audit tests
      - name: Run deterministic unit tests
        run: python -m pytest -q api_pilot/tests/test_strict_inference.py api_pilot/tests/test_pilot_runner.py tests/test_cli.py
